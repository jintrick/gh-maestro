agents:
  claude:
    skill_files_install_destination_directory: ~/.claude/skills
    skill_markdown_template_placeholder_substitutions:
      POLL_INTERVAL_SECONDS: 30
      POLL_MECHANISM: |
        Monitorツールを呼び出し、`command` に `node "{{SCRIPTS_PATH}}/poll-reviews.js" $PR $WORKSPACE` を直接指定して起動する。`persistent: true` を設定すること。他のツールを呼んではならない。

        Monitorから届く通知を処理する。`PR_MERGED` を受け取るまでこのループを続ける：
        - `REVIEW_COMMENT:...` → コメントトリアージを実行する。**完了後は直ちにMonitorに戻る**
        - `PR_COMMENT:...` → 同様にトリアージする。**完了後は直ちにMonitorに戻る**
        - `PR_REVIEW:<user>:<state>:<body>` → 正式レビュー提出（Submit reviewボタン経由）。stateがAPPROVEDなら人間にマージ許可のシグナルとして伝える。CHANGES_REQUESTEDならbodyをトリアージしてコーダーにフィードバックする。COMMENTEDならPR_COMMENTと同様にトリアージする。**完了後は直ちにMonitorに戻る**
        - `PR_MERGED:<PR番号>` → マージ完了。自律的に次のフローへ進む（ループ終了）
      INBOX_POLL_INTERVAL_SECONDS: 2
      INBOX_POLL_MECHANISM: |
        Monitorツールを呼び出し、`command` に `node "{{SCRIPTS_PATH}}/msg-poll.js" $WORKER_NAME --issue $ISSUE --workspace $WORKSPACE` を直接指定して起動する。`persistent: true` を設定すること。

        Monitorから届く通知を処理する：
        - `NEW_MESSAGE:<commentId>` → `node "{{SCRIPTS_PATH}}/msg-read.js" <commentId> --workspace $WORKSPACE` で本文を取得し、メッセージを処理する。処理後は必ず `msg-send.js` で結果を返信すること。**完了後は直ちにMonitorに戻る**
  agy:
    skill_files_install_destination_directory: ~/.gemini/antigravity-cli/skills
    skill_markdown_template_placeholder_substitutions:
      POLL_INTERVAL_SECONDS: 30
      POLL_MECHANISM: |
        `invoke_subagent` でポーリングサブエージェントを起動し、完了時に `send_message` で親へ通知させる。このサブエージェントはマージされるまで永続的に実行する。

        サブエージェントへの指示：
        「以下のループを実行する。STATE_FILEとして `$WORKSPACE/.gh-maestro/poll-state-$PR` を使用し、既知のコメントIDを管理する。
        1. `gh pr view $PR --repo $REPO --json state -q '.state'` を {{POLL_INTERVAL_SECONDS}}秒おきに実行する
        2. stateが MERGED になったら `send_message` で "PR_MERGED:$PR" を親に送り、終了する
        3. `gh api "/repos/$REPO/pulls/$PR/comments" --paginate` でインラインレビューコメントを取得し、新規のものがあれば `send_message` で "REVIEW_COMMENT:<path>:<line>:<user>:<body>" を親に送信し、コメントIDをSTATE_FILEに記録する
        4. `gh pr view $PR --repo $REPO --json comments` でPR全体コメントを取得し、同様に新規分を通知する
        5. `gh api "/repos/$REPO/pulls/$PR/reviews" --paginate` で正式レビュー提出を取得し、新規のものがあれば `send_message` で "PR_REVIEW:<user>:<state>:<body>" を親に送信する（state=APPROVED/CHANGES_REQUESTEDはbody空でも通知。state=COMMENTEDはbodyが空でない場合のみ通知）
        6. 新しいコメントがなければポーリング間隔を1.5倍に伸ばす（最大300秒）。あればリセットする
        ※ このサブエージェントはマージが検出されるまで終了しない」

        親として届く通知の処理：
        - `PR_REVIEW:<user>:APPROVED:<body>` → 人間にマージ許可シグナルとして提示する
        - `PR_REVIEW:<user>:CHANGES_REQUESTED:<body>` → bodyをトリアージしてコーダーにフィードバックする
        - `PR_REVIEW:<user>:COMMENTED:<body>` → PR_COMMENTと同様にトリアージする
      INBOX_POLL_INTERVAL_SECONDS: 600
      INBOX_POLL_MECHANISM: |
        以下はinbox確認の手順定義であり、今すぐ実行するものではない。**本来の作業（Issueの実装等）に着手した後**、作業の合間・区切りのタイミングで都度この手順を呼び出すこと。作業開始前にこれを先に実行して待機してはならない。

        手順: `node "{{SCRIPTS_PATH}}/msg-poll.js" $WORKER_NAME --issue $ISSUE --workspace $WORKSPACE --wait {{INBOX_POLL_INTERVAL_SECONDS}}` をフォアグラウンドで実行し、完了を待つ（`npm test` 等の実行完了を待つのと同じ扱い。他のツールを呼んではならない）。

        このコマンドは、新着メッセージを1件検出するか {{INBOX_POLL_INTERVAL_SECONDS}} 秒経過するかのいずれか早い方で自然に終了する（内部的には既定間隔でリトライする）。1回の呼び出しで返る `NEW_MESSAGE` は常に高々1件（複数件たまっていても最も古い1件のみ）。実行中は PID registry に自己登録されるため、外部から生存を検知できる。

        結果の処理：
        - 出力に `NEW_MESSAGE:<commentId>` が出力されている場合 → `node "{{SCRIPTS_PATH}}/msg-read.js" <commentId> --workspace $WORKSPACE` で本文を取得し、メッセージを処理する。`msg-send.js` で結果を返信してから、次の作業の区切りで再度この手順を呼び出す（未処理分が残っていれば次回の呼び出しで改めて返される）
        - 新着なし（タイムアウトで終了）の場合 → 何もせず、次の作業の区切りで再度この手順を呼び出す
  codex:
    skill_files_install_destination_directory: ~/.agents/skills
    skill_markdown_template_placeholder_substitutions:
      POLL_INTERVAL_SECONDS: 30
      POLL_MECHANISM: |
        `node "{{SCRIPTS_PATH}}/poll-reviews.js" $PR $WORKSPACE` を実行してPRレビュー通知を監視する。
        通知を受け取ったら以下の通り処理する:
        - `REVIEW_COMMENT:<path>:<line>:<user>:<body>` → インラインコメントをトリアージする
        - `PR_COMMENT:<user>:<body>` → PR全体コメントをトリアージする
        - `PR_REVIEW:<user>:<state>:<body>` → stateに応じてレビュー提出をトリアージする
      INBOX_POLL_INTERVAL_SECONDS: 2
      INBOX_POLL_MECHANISM: |
        `node "{{SCRIPTS_PATH}}/msg-poll.js" $WORKER_NAME --issue $ISSUE --workspace $WORKSPACE` を実行して inbox を監視する。
        通知を受け取ったら以下の通り処理する:
        - `NEW_MESSAGE:<commentId>` → `node "{{SCRIPTS_PATH}}/msg-read.js" <commentId> --workspace $WORKSPACE` で本文を取得し、メッセージを処理する。処理後は必ず `msg-send.js` で結果を返信すること
